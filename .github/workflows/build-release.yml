name: Build & Release VOXORA APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (NDK 27 + CMake 3.31 + ML Kit)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components (API 36.1, NDK 27.2.12479018, CMake 3.31.6)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "Using Android SDK at: $SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.31.6"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Cache Sherpa-ONNX v2.0.2 Android AAR
        id: cache-sherpa
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-static-link-onnxruntime-2.0.2.aar
          key: sherpa-onnx-static-link-onnxruntime-2.0.2-aar

      - name: Download Sherpa-ONNX v2.0.2 Android AAR
        if: steps.cache-sherpa.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/libs
          curl -fSL --retry 3 --retry-delay 5 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.2/sherpa-onnx-static-link-onnxruntime-2.0.2.aar" \
            -o app/libs/sherpa-onnx-static-link-onnxruntime-2.0.2.aar
          ls -lh app/libs/sherpa-onnx-static-link-onnxruntime-2.0.2.aar

      - name: Configure release keystore (GitHub Secrets or temporary fallback)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            EFFECTIVE_KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > app/voxora-release.jks

            # Map custom KEY_ALIAS onto the "upload" alias expected by app/build.gradle.kts
            # on this ephemeral CI copy (preserves the exact signing key & certificate fingerprint).
            if ! keytool -list -keystore app/voxora-release.jks -storepass "$KEYSTORE_PASSWORD" -alias upload >/dev/null 2>&1; then
              if [ -n "$KEY_ALIAS" ]; then
                keytool -changealias \
                  -keystore app/voxora-release.jks \
                  -alias "$KEY_ALIAS" \
                  -destalias upload \
                  -storepass "$KEYSTORE_PASSWORD" \
                  -keypass "$EFFECTIVE_KEY_PASSWORD"
                echo "Aligned CI keystore alias to 'upload' (cryptographic key unchanged)."
              else
                echo "::warning::KEY_ALIAS secret is empty and keystore does not contain alias 'upload'. Falling back to temporary keystore."
                rm -f app/voxora-release.jks
              fi
            fi

            if [ -f app/voxora-release.jks ]; then
              echo "Decoded permanent release keystore to app/voxora-release.jks."
              echo "signing_mode=secret" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "::warning::KEYSTORE_BASE64 secret is missing (or incomplete). Falling back to a temporary keystore so assembleRelease succeeds and publishes the APK. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in GitHub Secrets for permanent release signing."
          rm -f app/voxora-release.jks
          keytool -genkeypair -v \
            -keystore app/voxora-release.jks \
            -storepass voxora-temp-keystore \
            -alias upload \
            -keypass voxora-temp-keystore \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=VOXORA Temporary Release,O=VOXORA,C=US"
          echo "signing_mode=temporary" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK (Permanent Secret Keystore)
        if: steps.keystore.outputs.signing_mode == 'secret'
        env:
          VOXORA_KEYSTORE_PATH: ${{ github.workspace }}/app/voxora-release.jks
          KEYSTORE_PATH: ${{ github.workspace }}/app/voxora-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/36.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          fi

      - name: Build Release APK (Temporary Fallback Keystore)
        if: steps.keystore.outputs.signing_mode == 'temporary'
        env:
          VOXORA_KEYSTORE_PATH: ${{ github.workspace }}/app/voxora-release.jks
          KEYSTORE_PATH: ${{ github.workspace }}/app/voxora-release.jks
          KEYSTORE_PASSWORD: voxora-temp-keystore
          STORE_PASSWORD: voxora-temp-keystore
          KEY_ALIAS: upload
          KEY_PASSWORD: voxora-temp-keystore
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/36.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          fi

      - name: Prepare versioned APK asset
        id: apk
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          else
            VERSION_NAME="$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
            VERSION_TAG="v${VERSION_NAME:-dev}-${GITHUB_SHA::7}"
          fi
          APK_NAME="VOXORA-${VERSION_TAG}.apk"
          mkdir -p release-artifacts
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          cp "$SOURCE_APK" "release-artifacts/${APK_NAME}"
          ls -lh "release-artifacts/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=release-artifacts/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "VOXORA ${{ github.ref_name }}"
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.apk.outputs.apk_path }}

      - name: Clean up decoded keystore
        if: always()
        run: rm -f app/voxora-release.jks
